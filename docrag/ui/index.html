<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>docrag</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <span class="wordmark">docrag</span>
  <span class="stats" id="stats">Loading the index…</span>
</header>

<main>
  <form id="ask" autocomplete="off">
    <div class="ask">
      <label for="q" class="visually-hidden">Question</label>
      <textarea id="q" rows="1" placeholder="Ask about the docs or the channels…" required></textarea>
      <div class="ask-actions">
        <button type="submit" id="go" class="btn btn-ink">Search</button>
        <button type="button" id="brief" class="btn btn-quiet"
                title="Copies a prompt asking Copilot to write the search queries">Brief for Copilot</button>
      </div>
    </div>
    <div class="field field-queries">
      <div class="queries-label">
        <label class="field-label" for="queries">Search queries, one per line (optional)</label>
        <button type="button" id="queries-clear" class="linkish" hidden>Clear</button>
      </div>
      <textarea id="queries" class="input" rows="2" aria-describedby="queries-help"
                placeholder="Empty: the question is the search"></textarea>
      <span class="visually-hidden" id="queries-help">Enter searches. Shift+Enter starts a new line.</span>
    </div>
  </form>

  <section class="filters" aria-label="Filters">
    <div class="field field-sources">
      <span class="field-label" id="src-label">Sources</span>
      <div class="combo" id="combo">
        <div class="combo-box" id="combo-box">
          <div class="chips" id="chips"></div>
          <input id="combo-input" type="text" role="combobox" aria-labelledby="src-label"
                 aria-expanded="false" aria-controls="combo-list" aria-autocomplete="list"
                 placeholder="All sources">
          <button type="button" class="combo-toggle" id="combo-toggle" tabindex="-1" aria-label="Show sources">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" /></svg>
          </button>
        </div>
        <ul class="combo-list" id="combo-list" role="listbox" aria-multiselectable="true" hidden></ul>
      </div>
    </div>

    <div class="field">
      <label class="field-label" for="since">Chat since</label>
      <input type="date" id="since" class="input">
    </div>

    <div class="field">
      <span class="field-label" id="k-label">Pages</span>
      <div class="stepper" role="group" aria-labelledby="k-label">
        <button type="button" class="step" data-step="-1" aria-label="Fewer pages">−</button>
        <input id="k" type="number" min="1" max="50" value="5" aria-labelledby="k-label">
        <button type="button" class="step" data-step="1" aria-label="More pages">+</button>
      </div>
    </div>

    <div class="field">
      <span class="field-label" id="keywords-label">Match</span>
      <label class="switch">
        <input type="checkbox" id="keywords" aria-labelledby="keywords-label">
        <span class="track" aria-hidden="true"></span>
        <span class="switch-text" id="keywords-text">Meaning</span>
      </label>
    </div>

    <div class="field field-rerank" id="rerank-field">
      <span class="field-label" id="rerank-label">Ranking</span>
      <label class="switch">
        <input type="checkbox" id="rerank" checked aria-labelledby="rerank-label">
        <span class="track" aria-hidden="true"></span>
        <span class="switch-text" id="rerank-text">Precise</span>
      </label>
    </div>

    <div class="field field-size">
      <label class="field-label" for="size">Size</label>
      <input type="range" id="size" min="4000" max="200000" step="1000" value="24000">
      <output id="size-out" for="size"></output>
    </div>
  </section>

  <section class="packet" id="packet" hidden>
    <div class="meter" id="meter" aria-hidden="true"></div>
    <div class="packet-bar">
      <p class="packet-text" id="packet-text"></p>
      <button type="button" class="btn btn-ink" id="copy">Copy for Copilot</button>
    </div>
    <ol class="query-legend" id="query-legend" aria-label="Search queries" hidden></ol>
  </section>

  <p class="notice" id="notice" role="status" hidden></p>
  <ol class="results" id="results"></ol>
</main>

<script src="app.js"></script>
</body>
</html>
